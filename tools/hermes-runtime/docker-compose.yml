services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-opm:local
    container_name: hermes-opm
    restart: unless-stopped
    command: gateway run
    environment:
      HERMES_HOME: /opt/data
      TERMINAL_ENV: local
      TERMINAL_CWD: /workspace/project
    volumes:
      - ${HERMES_HOME_DIR:-/Users/jason66/.hermes-opm}:/opt/data
      - ${PROJECT_ROOT:-/Volumes/KLEVV-4T-1/Real Estate Management Projects/Owner-Property-Management-AI-SPA}:/workspace/project
    extra_hosts:
      - host.docker.internal:host-gateway
    shm_size: 1gb

  hermes-dashboard:
    image: hermes-opm:local
    container_name: hermes-dashboard
    restart: unless-stopped
    command: dashboard --host 0.0.0.0 --port ${HERMES_DASHBOARD_PORT:-9119} --no-open
    environment:
      HERMES_HOME: /opt/data
    ports:
      - "${HERMES_DASHBOARD_PORT:-9119}:${HERMES_DASHBOARD_PORT:-9119}"
    volumes:
      - ${HERMES_HOME_DIR:-/Users/jason66/.hermes-opm}:/opt/data
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - hermes
