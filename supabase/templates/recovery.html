<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重設密碼</title>
</head>
<body style="margin: 0; padding: 0; background-color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
    <tr>
      <td align="center" style="padding-bottom: 30px;">
        <div style="background-color: #7C3AED; width: 64px; height: 64px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;">
          <span style="color: white; font-size: 28px;">🏠</span>
        </div>
      </td>
    </tr>
    <tr>
      <td style="background-color: #2a2a2a; border-radius: 12px; padding: 40px; border: 1px solid #333;">
        <h1 style="color: #ffffff; font-size: 24px; margin: 0 0 16px; text-align: center;">重設您的密碼</h1>
        <p style="color: #999999; font-size: 16px; line-height: 1.6; margin: 0 0 24px; text-align: center;">
          我們收到了重設您帳戶密碼的請求。<br>
          請點擊下方按鈕設定新密碼。
        </p>
        <table width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td align="center" style="padding: 8px 0 24px;">
              <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
                 style="display: inline-block; padding: 14px 32px; background-color: #7C3AED; color: #ffffff; text-decoration: none; border-radius: 8px; font-size: 16px; font-weight: 600;">
                重設密碼
              </a>
            </td>
          </tr>
        </table>
        <hr style="border: none; border-top: 1px solid #333; margin: 24px 0;">
        <p style="color: #666666; font-size: 13px; line-height: 1.5; margin: 0; text-align: center;">
          如果您沒有要求重設密碼，請忽略此郵件。<br>
          此連結將在 1 小時後過期。
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding-top: 24px; text-align: center;">
        <p style="color: #555; font-size: 12px; margin: 0;">
          &copy; 2026 物業管理系統 &mdash; Owner Property Management
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
