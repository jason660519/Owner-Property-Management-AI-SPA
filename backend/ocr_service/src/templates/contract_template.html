
<!DOCTYPE html>
<html>
<head>
    <title>Contract</title>
    <style>
        body { font-family: sans-serif; margin: 2cm; }
        h1 { color: #333; }
        .signature-block { margin-top: 50px; border-top: 1px solid #ccc; padding-top: 10px; }
    </style>
</head>
<body>
    <h1>Contract Agreement</h1>
    
    <p>This contract is between <strong>{{ contract.party_a }}</strong> and <strong>{{ contract.party_b }}</strong>.</p>
    
    <p><strong>Contract Details:</strong></p>
    <ul>
        <li><strong>Amount:</strong> {{ contract.amount }}</li>
        <li><strong>Date:</strong> {{ contract.date }}</li>
    </ul>

    <div class="signature-block">
        <p>Signed by: {{ contract.signer_name }}</p>
        <p>Date: {{ contract.signed_at }}</p>
        <p>IP Address: {{ contract.ip_address }}</p>
    </div>
</body>
</html>
