name: Collect Adapter CLI Help (every 15 days)

on:
  schedule:
    # Run on the 1st and 16th of every month at 09:00 UTC (~15-day interval)
    - cron: '0 9 1,16 * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CLIs (available ones)
        run: |
          npm install -g @anthropic-ai/claude-code || true
          npm install -g opencode-ai || true
        continue-on-error: true

      - name: Run collect-cli-help.sh
        run: |
          bash scripts/collect-cli-help.sh /tmp/cli-help-raw
        continue-on-error: true

      - name: Upload raw help output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-help-raw-${{ github.run_id }}
          path: /tmp/cli-help-raw/
          retention-days: 30

      - name: Create reminder issue
        env:
          RUN_ID: ${{ github.run_id }}
          TODAY: ${{ github.event.repository.updated_at }}
        uses: actions/github-script@v7
        with:
          script: |
            const runId = process.env.RUN_ID;
            const today = new Date().toISOString().slice(0, 10);
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'cli-docs-update',
              state: 'open',
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Adapter CLI Docs] 15-day update reminder — ${today}`,
                body: `The scheduled CLI help collection has run.\n\nArtifact \`cli-help-raw-${runId}\` is attached to this workflow run.\n\nNext step: run \`/update-cli-docs\` in Claude Code to update the Adapter CLI docs in \`docs/Adapter CLIs/\`.`,
                labels: ['cli-docs-update'],
              });
            }
