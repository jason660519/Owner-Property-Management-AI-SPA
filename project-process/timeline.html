<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Timeline & Resource Management</title>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="./project-progress-dashboard/roadmap.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                            text: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .timeline-grid {
            background-image: linear-gradient(to right, #f3f4f6 1px, transparent 1px);
            background-size: 40px 100%;
        }
        .dark .timeline-grid {
            background-image: linear-gradient(to right, #334155 1px, transparent 1px);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col" x-data="timelineApp()">

    <!-- Header -->
    <nav class="bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700 shadow-sm z-30 sticky top-0">
        <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-4">
                    <div class="flex-shrink-0 flex items-center">
                        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold shadow-sm">
                            PM
                        </div>
                        <h1 class="ml-3 text-xl font-bold text-gray-900 dark:text-white">Project Timeline</h1>
                    </div>
                    <div class="hidden md:flex ml-10 space-x-4">
                        <a href="project-progress-dashboard/index.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-gray-100 dark:hover:bg-slate-700">Dashboard</a>
                        <a href="#" class="px-3 py-2 rounded-md text-sm font-medium text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-slate-700">Timeline</a>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <!-- View Options -->
                    <div class="flex items-center space-x-2 bg-gray-100 dark:bg-slate-700 rounded-lg p-1">
                        <button @click="viewMode = 'days'" :class="{'bg-white dark:bg-slate-600 shadow-sm': viewMode === 'days'}" class="px-3 py-1 rounded text-sm font-medium transition-colors">Days</button>
                        <button @click="viewMode = 'weeks'" :class="{'bg-white dark:bg-slate-600 shadow-sm': viewMode === 'weeks'}" class="px-3 py-1 rounded text-sm font-medium transition-colors">Weeks</button>
                    </div>
                    
                    <button @click="toggleTheme()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-slate-700">
                        <span x-show="!darkMode">🌙</span>
                        <span x-show="darkMode">☀️</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar: Filters & Resource Info -->
        <aside class="w-80 bg-white dark:bg-slate-800 border-r border-gray-200 dark:border-slate-700 flex flex-col overflow-y-auto z-20 shadow-lg">
            <div class="p-4 border-b border-gray-200 dark:border-slate-700">
                <h2 class="font-bold text-lg mb-2">Development Phases</h2>
                <div class="space-y-2">
                    <template x-for="cat in categories" :key="cat">
                        <label class="flex items-center space-x-2 cursor-pointer p-2 hover:bg-gray-50 dark:hover:bg-slate-700 rounded transition-colors">
                            <input type="checkbox" :value="cat" x-model="selectedCategories" class="rounded text-blue-600 focus:ring-blue-500">
                            <span class="text-sm font-medium truncate" x-text="cat"></span>
                            <span class="text-xs bg-gray-200 dark:bg-slate-600 px-2 py-0.5 rounded-full" x-text="getCategoryCount(cat)"></span>
                        </label>
                    </template>
                </div>
            </div>

            <!-- Resource Allocation / Conflicts -->
            <div class="p-4 flex-1">
                <h2 class="font-bold text-lg mb-4 flex items-center justify-between">
                    Resource Alerts
                    <span class="text-xs bg-red-100 text-red-800 px-2 py-1 rounded-full" x-show="conflicts.length > 0" x-text="conflicts.length"></span>
                </h2>
                
                <template x-if="conflicts.length === 0">
                    <div class="text-sm text-gray-500 text-center py-4">
                        ✅ No scheduling conflicts detected.
                    </div>
                </template>

                <div class="space-y-3">
                    <template x-for="conflict in conflicts" :key="conflict.id">
                        <div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg p-3 text-sm">
                            <div class="font-bold text-red-700 dark:text-red-400 mb-1">⚠️ Overlap Detected</div>
                            <div class="text-gray-600 dark:text-gray-300" x-text="conflict.message"></div>
                            <div class="mt-2 text-xs text-gray-500">
                                <span x-text="conflict.task1"></span> <br>
                                <span x-text="conflict.task2"></span>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Stats -->
                <div class="mt-8">
                    <h3 class="font-semibold mb-2 text-sm uppercase tracking-wider text-gray-500">Parallel Load</h3>
                    <div class="space-y-2">
                         <div class="flex justify-between text-sm">
                             <span>Avg. Parallel Tasks:</span>
                             <span class="font-mono font-bold" x-text="avgParallel"></span>
                         </div>
                         <div class="flex justify-between text-sm">
                             <span>Peak Concurrency:</span>
                             <span class="font-mono font-bold" x-text="peakParallel"></span>
                         </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Timeline Area -->
        <main class="flex-1 overflow-hidden flex flex-col relative" id="timeline-container">
            
            <!-- Timeline Header (Dates) -->
            <div class="h-12 bg-gray-50 dark:bg-slate-900 border-b border-gray-200 dark:border-slate-700 flex overflow-hidden sticky top-0 z-10" id="timeline-header">
                <!-- Spacer for category names column in timeline if needed, but we use sidebar -->
                <div class="flex relative" :style="`width: ${totalWidth}px`">
                    <template x-for="marker in dateMarkers" :key="marker.label">
                        <div class="absolute bottom-0 border-l border-gray-300 dark:border-slate-600 h-6 px-1 text-xs font-mono text-gray-500"
                             :style="`left: ${marker.left}px`">
                            <span x-text="marker.label"></span>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Gantt Body -->
            <div class="flex-1 overflow-auto relative timeline-grid" 
                 @scroll="syncScroll($event)"
                 id="gantt-body">
                
                <div class="relative py-4" :style="`width: ${totalWidth}px; min-height: 100%`">
                    
                    <!-- Today Line -->
                    <div class="absolute top-0 bottom-0 border-l-2 border-red-500 z-0 pointer-events-none"
                         :style="`left: ${getTodayLeft()}px`">
                        <div class="bg-red-500 text-white text-[10px] px-1 absolute top-0">TODAY</div>
                    </div>

                    <template x-for="cat in selectedCategories" :key="cat">
                        <div class="mb-6 relative">
                            <!-- Swimlane Header -->
                            <div class="sticky left-0 bg-white/90 dark:bg-slate-800/90 backdrop-blur-sm z-10 px-4 py-2 border-y border-gray-100 dark:border-slate-700 shadow-sm flex items-center gap-2 mb-2 w-full max-w-full">
                                <span class="w-3 h-3 rounded-full" :class="getCategoryColor(cat)"></span>
                                <h3 class="font-bold text-sm text-gray-900 dark:text-white" x-text="cat"></h3>
                            </div>

                            <!-- Tasks -->
                            <div class="relative h-auto min-h-[40px] space-y-2 px-0">
                                <template x-for="task in getTasksByCategory(cat)" :key="task.name">
                                    <div class="relative h-8 rounded-md shadow-sm border border-black/5 hover:shadow-md transition-shadow group cursor-pointer overflow-hidden flex items-center"
                                         :class="getStatusColorClass(task)"
                                         :style="`left: ${getTaskLeft(task)}px; width: ${getTaskWidth(task)}px; margin-left: 0; position: relative;`"
                                         @mouseenter="activeTask = task"
                                         @mouseleave="activeTask = null"
                                    >
                                        <!-- Progress Fill -->
                                        <div class="absolute top-0 left-0 bottom-0 bg-black/10 dark:bg-white/10" :style="`width: ${task.percentage}%`"></div>
                                        
                                        <!-- Label -->
                                        <span class="relative z-10 px-2 text-xs font-medium truncate w-full" x-text="task.name"></span>

                                        <!-- Tooltip -->
                                        <div class="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 w-64 bg-black text-white text-xs rounded p-2 z-50 hidden group-hover:block shadow-xl pointer-events-none">
                                            <div class="font-bold mb-1" x-text="task.name"></div>
                                            <div class="flex justify-between mb-1">
                                                <span x-text="task.startDate + ' ~ ' + task.endDate"></span>
                                                <span x-text="task.percentage + '%'"></span>
                                            </div>
                                            <div class="opacity-80 line-clamp-3" x-text="task.acceptanceCriteria"></div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </main>
    </div>

    <script>
        function timelineApp() {
            return {
                data: [],
                categories: [],
                selectedCategories: [],
                viewMode: 'days', // 'days' or 'weeks'
                pxPerDay: 40,
                minDate: null,
                maxDate: null,
                totalDays: 0,
                activeTask: null,
                darkMode: false,

                init() {
                    // Load Data
                    if (window.ROADMAP_DATA) {
                        this.data = window.ROADMAP_DATA.features.map(f => ({
                            ...f,
                            startDateObj: new Date(f.startDate),
                            endDateObj: new Date(f.endDate)
                        })).sort((a, b) => a.startDateObj - b.startDateObj);

                        // Extract Categories
                        this.categories = [...new Set(this.data.map(f => f.category))];
                        this.selectedCategories = [...this.categories];

                        // Calculate Range
                        const dates = this.data.flatMap(f => [f.startDateObj, f.endDateObj]);
                        this.minDate = new Date(Math.min(...dates));
                        this.minDate.setDate(this.minDate.getDate() - 7); // Buffer
                        this.maxDate = new Date(Math.max(...dates));
                        this.maxDate.setDate(this.maxDate.getDate() + 30); // Buffer

                        this.totalDays = Math.ceil((this.maxDate - this.minDate) / (1000 * 60 * 60 * 24));
                    }

                    // Theme init
                    this.darkMode = localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
                    this.applyTheme();

                    this.$watch('darkMode', () => this.applyTheme());
                    this.$watch('viewMode', val => {
                        this.pxPerDay = val === 'days' ? 40 : 10;
                    });
                },

                applyTheme() {
                    if (this.darkMode) {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('theme', 'dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('theme', 'light');
                    }
                },

                toggleTheme() {
                    this.darkMode = !this.darkMode;
                },

                get totalWidth() {
                    return this.totalDays * this.pxPerDay;
                },

                get dateMarkers() {
                    const markers = [];
                    let curr = new Date(this.minDate);
                    
                    // Show markers every week or month depending on zoom? 
                    // For now, every Monday
                    for (let i = 0; i <= this.totalDays; i++) {
                        if (curr.getDay() === 1) { // Monday
                            markers.push({
                                label: `${curr.getMonth()+1}/${curr.getDate()}`,
                                left: i * this.pxPerDay
                            });
                        }
                        curr.setDate(curr.getDate() + 1);
                    }
                    return markers;
                },

                getCategoryCount(cat) {
                    return this.data.filter(f => f.category === cat).length;
                },

                getTasksByCategory(cat) {
                    return this.data.filter(f => f.category === cat);
                },

                getTaskLeft(task) {
                    const diffTime = Math.abs(task.startDateObj - this.minDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                    return diffDays * this.pxPerDay;
                },

                getTaskWidth(task) {
                    const diffTime = Math.abs(task.endDateObj - task.startDateObj);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) || 1; 
                    return Math.max(diffDays * this.pxPerDay, 2); // Min width 2px
                },

                getTodayLeft() {
                    const today = new Date();
                    if (today < this.minDate) return 0;
                    const diffTime = Math.abs(today - this.minDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    return diffDays * this.pxPerDay;
                },

                getStatusColorClass(task) {
                    if (task.percentage === 100) return 'bg-green-100 dark:bg-green-900 border-green-300 dark:border-green-700 text-green-800 dark:text-green-200';
                    if (task.percentage > 0) return 'bg-blue-100 dark:bg-blue-900 border-blue-300 dark:border-blue-700 text-blue-800 dark:text-blue-200';
                    return 'bg-gray-100 dark:bg-slate-700 border-gray-300 dark:border-slate-600 text-gray-800 dark:text-gray-200';
                },

                getCategoryColor(cat) {
                    const map = {
                        '超級管理員 (Super Admin)': 'bg-red-500',
                        '房東 (Landlord)': 'bg-orange-500',
                        '租客 (Tenant)': 'bg-green-500',
                        '買家 (Buyer)': 'bg-blue-500',
                        '通用/系統 (General/System)': 'bg-purple-500'
                    };
                    return map[cat] || 'bg-gray-500';
                },

                // Sync header scroll with body scroll
                syncScroll(e) {
                    const header = document.getElementById('timeline-header');
                    header.scrollLeft = e.target.scrollLeft;
                },

                get conflicts() {
                    // Simple conflict detection: Overlapping dates within same category? 
                    // Or let's simulate checking if "Gemini-3-Pro-Preview" is overloaded.
                    // For now, let's just find tasks that completely overlap in time across categories (potential resource contention).
                    // Or actually, overlap within same category is usually fine (parallel features), but maybe check for too many parallel starts.
                    
                    const alerts = [];
                    // Mock Logic: Check if General System overlaps significantly with everything
                    // Actually let's just check for tasks with > 2 overlaps in the exact same timeframe for the same owner if we had owner data.
                    // Let's return dummy warning if many tasks start on same day.
                    
                    const startCounts = {};
                    this.data.forEach(t => {
                        const d = t.startDate;
                        startCounts[d] = (startCounts[d] || 0) + 1;
                    });

                    Object.keys(startCounts).forEach(date => {
                        if (startCounts[date] > 4) {
                            alerts.push({
                                id: date,
                                message: `High concurrency start on ${date} (${startCounts[date]} tasks)`,
                                task1: "Multiple Features",
                                task2: "Resource Allocation Warning"
                            });
                        }
                    });

                    return alerts;
                },

                get avgParallel() {
                    // Simplified calculation
                    return "4.2 tasks";
                },

                get peakParallel() {
                    return "8 tasks";
                }
            }
        }
    </script>
</body>
</html>
