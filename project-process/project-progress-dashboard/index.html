<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專案開發進度儀表板</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="roadmap.js"></script>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                            text: '#f8fafc',
                            muted: '#94a3b8',
                            
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .progress-bar-striped {
            background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);
            background-size: 1rem 1rem;
        }
        .animate-progress {
            animation: progress-bar-stripes 1s linear infinite;
        }
        @keyframes progress-bar-stripes {
            0% { background-position: 1rem 0; }
            100% { background-position: 0 0; }
        }
        /* Resizer Styles */
        .resizer {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            cursor: col-resize;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .resizer::after {
            content: '';
            width: 1px;
            height: 50%;
            background-color: #e5e7eb; /* gray-200 */
            transition: background-color 0.2s;
        }
        .resizer:hover::after, .grid-container.resizing .resizer::after {
            background-color: #3b82f6; /* blue-500 */
            width: 2px;
        }
        .header-cell {
            position: relative;
            display: flex;
            align-items: center;
            height: 100%;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 min-h-screen font-sans text-gray-900 dark:text-gray-100" x-data="dashboard()">
    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700 sticky top-0 z-10 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold shadow-sm">
                    PM
                </div>
                <h1 class="text-xl font-bold text-gray-900 dark:text-white">專案開發進度儀表板</h1>
                <nav class="flex ml-6 space-x-2">
                    <a href="../over-view/index.html" class="px-3 py-1.5 rounded-md bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-gray-300 hover:bg-blue-50 dark:hover:bg-blue-900 hover:text-blue-600 dark:hover:text-blue-400 font-medium transition text-sm">Overview</a>
                    <a href="../timeline.html" class="px-3 py-1.5 rounded-md bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-gray-300 hover:bg-blue-50 dark:hover:bg-blue-900 hover:text-blue-600 dark:hover:text-blue-400 font-medium transition text-sm">Timeline</a>
                    <a href="../analysis.html" class="px-3 py-1.5 rounded-md bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-gray-300 hover:bg-blue-50 dark:hover:bg-blue-900 hover:text-blue-600 dark:hover:text-blue-400 font-medium transition text-sm">Package Analysis</a>
                </nav>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center bg-gray-100 dark:bg-slate-700 rounded-full p-1 border border-gray-200 dark:border-slate-600">
                    <!-- Light Mode Button -->
                    <button 
                        @click="darkMode = false" 
                        class="p-1.5 rounded-full transition-all duration-200 flex items-center justify-center"
                        :class="!darkMode ? 'bg-white text-yellow-500 shadow-sm' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'"
                        title="Light Mode"
                    >
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                    </button>
                    <!-- Dark Mode Button -->
                    <button 
                        @click="darkMode = true" 
                        class="p-1.5 rounded-full transition-all duration-200 flex items-center justify-center"
                        :class="darkMode ? 'bg-slate-600 text-yellow-400 shadow-sm' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'"
                        title="Dark Mode"
                    >
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                    </button>
                </div>
                <div class="text-sm text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-slate-800 px-3 py-1 rounded-full border dark:border-slate-700">
                    最後更新: <span x-text="lastUpdated" class="font-medium text-gray-700 dark:text-gray-300"></span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Overview Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Overall Progress -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-200 dark:border-slate-700 p-6 flex items-center gap-6">
                <div class="relative w-24 h-24 flex-shrink-0">
                    <svg class="w-full h-full transform -rotate-90">
                        <circle cx="48" cy="48" r="40" stroke="currentColor" stroke-width="8" fill="transparent" class="text-gray-100 dark:text-slate-700" />
                        <circle cx="48" cy="48" r="40" stroke="currentColor" stroke-width="8" fill="transparent" 
                            :stroke-dasharray="251.2"
                            :stroke-dashoffset="251.2 - (251.2 * overallProgress / 100)"
                            class="text-blue-600 transition-all duration-1000 ease-out"
                            stroke-linecap="round"
                        />
                    </svg>
                    <div class="absolute top-0 left-0 w-full h-full flex flex-col items-center justify-center">
                        <span class="text-xl font-bold text-gray-900 dark:text-white" x-text="Math.round(overallProgress) + '%'"></span>
                    </div>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-gray-900 dark:text-white">總體開發進度</h2>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">基於所有功能模組的加權計算</p>
                    <div class="mt-2 text-xs text-gray-400">
                        共 <span x-text="totalFeatures"></span> 個功能模組
                    </div>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-200 dark:border-slate-700 p-6">
                <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-4">狀態分佈</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="text-center p-2 bg-green-50 dark:bg-green-900/30 rounded-lg">
                        <div class="text-2xl font-bold text-green-600 dark:text-green-400" x-text="completedCount"></div>
                        <div class="text-xs text-green-700 dark:text-green-300 font-medium">已完成 (100%)</div>
                    </div>
                    <div class="text-center p-2 bg-blue-50 dark:bg-blue-900/30 rounded-lg">
                        <div class="text-2xl font-bold text-blue-600 dark:text-blue-400" x-text="inProgressCount"></div>
                        <div class="text-xs text-blue-700 dark:text-blue-300 font-medium">進行中</div>
                    </div>
                    <div class="text-center p-2 bg-gray-50 dark:bg-slate-700 rounded-lg">
                        <div class="text-2xl font-bold text-gray-600 dark:text-gray-300" x-text="pendingCount"></div>
                        <div class="text-xs text-gray-700 dark:text-gray-400 font-medium">未開始 (0%)</div>
                    </div>
                    <div class="text-center p-2 bg-purple-50 dark:bg-purple-900/30 rounded-lg">
                        <div class="text-2xl font-bold text-purple-600 dark:text-purple-400" x-text="totalPoints"></div>
                        <div class="text-xs text-purple-700 dark:text-purple-300 font-medium">總 Story Points</div>
                    </div>
                </div>
            </div>

            <!-- Legend/Info -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-200 dark:border-slate-700 p-6">
                 <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-4">說明</h3>
                 <ul class="space-y-2 text-sm text-gray-600 dark:text-gray-300">
                     <li class="flex items-center gap-2">
                         <span class="w-2 h-2 rounded-full bg-blue-600"></span>
                         <span>進度條顯示各功能的完成百分比</span>
                     </li>
                     <li class="flex items-center gap-2">
                         <span class="w-2 h-2 rounded-full bg-gray-400"></span>
                         <span>點擊文件圖示可跳轉至相關開發文檔</span>
                     </li>
                     <li class="flex items-center gap-2">
                         <span class="w-2 h-2 rounded-full bg-purple-500"></span>
                         <span>SP (Story Points) 代表開發複雜度權重</span>
                     </li>
                 </ul>
            </div>
        </div>

        <!-- Features List -->
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-200 dark:border-slate-700 overflow-hidden">
            <div class="divide-y divide-gray-200 dark:divide-slate-700" 
                @mousemove.window="handleResize($event)"
                @mouseup.window="stopResize()"
                :class="{ 'resizing': resizingIdx !== -1 }">
                
                <!-- 欄位標題列 -->
                <div class="hidden md:grid grid-container px-6 py-3 bg-gray-100/80 dark:bg-slate-800/80 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider border-b border-gray-200 dark:border-slate-700 sticky top-0 z-20"
                     :style="`grid-template-columns: ${colWidths.join(' ')}`">
                    <div class="header-cell min-w-0 pr-4">
                        編號
                        <div class="resizer" @mousedown.stop.prevent="startResize(0, $event)"></div>
                    </div>
                    <div class="header-cell min-w-0 pr-4">
                        分類
                        <div class="resizer" @mousedown.stop.prevent="startResize(1, $event)"></div>
                    </div>
                    <div class="header-cell min-w-0 pr-4">
                        功能
                        <div class="resizer" @mousedown.stop.prevent="startResize(2, $event)"></div>
                    </div>
                    <div class="header-cell min-w-0 pr-4">
                        驗收標準
                        <div class="resizer" @mousedown.stop.prevent="startResize(3, $event)"></div>
                    </div>
                    <div class="header-cell pr-4">
                        進度
                        <div class="resizer" @mousedown.stop.prevent="startResize(4, $event)"></div>
                    </div>
                    <div class="header-cell pr-4">
                        最後修改人
                        <div class="resizer" @mousedown.stop.prevent="startResize(5, $event)"></div>
                    </div>
                    <div class="header-cell justify-start">開發進度日誌</div>
                </div>

                <template x-for="(feature, index) in features" :key="feature.name">
                    <div class="px-6 py-4 hover:bg-gray-50 dark:hover:bg-slate-700 transition-colors group">
                        <div class="flex flex-col md:grid md:gap-0 items-center" :style="`grid-template-columns: ${colWidths.join(' ')}`">
                            
                            <!-- ID -->
                            <div class="mb-2 md:mb-0 min-w-0 pr-4">
                                <span class="font-mono text-xs text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-slate-600 px-2 py-1 rounded" x-text="(index + 1).toString().padStart(3, '0')"></span>
                            </div>

                            <!-- Category -->
                            <div class="mb-2 md:mb-0 min-w-0 pr-4">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 dark:bg-slate-600 text-gray-800 dark:text-gray-200" x-text="feature.category"></span>
                            </div>

                            <!-- Title & Doc Path -->
                            <div class="mb-2 md:mb-0 min-w-0 pr-4">
                                <div class="mb-1">
                                    <h3 class="font-medium text-gray-900 dark:text-gray-100 break-words" x-text="feature.name"></h3>
                                </div>
                            </div>

                            <!-- Acceptance Criteria -->
                            <div class="mb-2 md:mb-0 min-w-0 pr-4 w-full">
                                <div class="text-sm text-gray-600 dark:text-gray-400 break-words" x-html="feature.acceptanceCriteria ? feature.acceptanceCriteria.replace(/\n/g, '<br>') : ''"></div>
                            </div>

                            <!-- Progress Bar -->
                            <div class="mb-2 md:mb-0 min-w-0 pr-4 w-full">
                                <div class="relative w-full h-5 bg-gray-100 dark:bg-slate-700 rounded-full overflow-hidden shadow-inner">
                                    <div 
                                        class="h-full rounded-full transition-all duration-500 absolute top-0 left-0"
                                        :class="{
                                            'bg-green-500': feature.percentage === 100,
                                            'bg-blue-500 progress-bar-striped animate-progress': feature.percentage > 0 && feature.percentage < 100,
                                            'bg-gray-300 dark:bg-slate-600': feature.percentage === 0
                                        }"
                                        :style="`width: ${feature.percentage}%`"
                                    ></div>
                                    <div class="absolute inset-0 flex items-center justify-center">
                                        <span class="text-xs font-bold text-white drop-shadow-md" 
                                            x-text="feature.percentage + '%'">
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <!-- 最後修改人 -->
                            <div class="mb-2 md:mb-0 min-w-0 pr-4 w-full">
                                <span class="text-sm text-gray-600 dark:text-gray-400" x-text="feature.lastModifiedBy || ''"></span>
                            </div>
                            
                            <!-- 開發進度日誌 -->
                            <div class="mb-2 md:mb-0 min-w-0 pr-4 w-full flex justify-start items-center gap-2">
                                <span class="text-sm text-gray-600 dark:text-gray-400 font-mono" x-text="feature.lastModifiedDate || ''"></span>
                                <template x-if="feature.docPath">
                                    <a :href="'editor.html?file=' + feature.docPath" target="_blank" class="p-1.5 text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition-colors border border-transparent hover:border-blue-100 dark:hover:border-blue-800" title="編輯文檔">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                    </a>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <script>
        function dashboard() {
            return {
                // Resize Logic State
                colWidths: JSON.parse(localStorage.getItem('dashboard_col_widths')) || ['5%', '15%', '15%', '25%', '10%', '10%', '20%'],
                resizingIdx: -1,
                startX: 0,
                startWidths: [],
                containerWidth: 0,

                // Theme State
                darkMode: localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches),

                init() {
                    // Reset widths if column count changed (now 7 columns)
                    if (this.colWidths.length !== 7) {
                        this.colWidths = ['5%', '15%', '15%', '25%', '10%', '10%', '20%'];
                    }

                    this.$watch('colWidths', val => localStorage.setItem('dashboard_col_widths', JSON.stringify(val)));

                    // Initialize Theme
                    if (this.darkMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }

                    this.$watch('darkMode', val => {
                        if (val) {
                            document.documentElement.classList.add('dark');
                            localStorage.setItem('theme', 'dark');
                        } else {
                            document.documentElement.classList.remove('dark');
                            localStorage.setItem('theme', 'light');
                        }
                    });
                },

                toggleTheme() {
                    this.darkMode = !this.darkMode;
                },

                startResize(idx, e) {
                    this.resizingIdx = idx;
                    this.startX = e.clientX;
                    this.startWidths = this.colWidths.map(w => parseFloat(w));
                    
                    // Find the closest grid container to measure total width
                    const container = e.target.closest('.grid-container');
                    this.containerWidth = container ? container.getBoundingClientRect().width : window.innerWidth;
                    
                    document.body.style.userSelect = 'none';
                    document.body.style.cursor = 'col-resize';
                },

                handleResize(e) {
                    if (this.resizingIdx === -1) return;
                    
                    const deltaX = e.clientX - this.startX;
                    const deltaPercent = (deltaX / this.containerWidth) * 100;
                    
                    let newCurrentWidth = this.startWidths[this.resizingIdx] + deltaPercent;
                    let newNextWidth = this.startWidths[this.resizingIdx + 1] - deltaPercent;
                    
                    // Min width check (3%) - Reduced for ID column
                    if (newCurrentWidth > 3 && newNextWidth > 3) {
                        let newWidths = [...this.colWidths];
                        newWidths[this.resizingIdx] = newCurrentWidth.toFixed(2) + '%';
                        newWidths[this.resizingIdx + 1] = newNextWidth.toFixed(2) + '%';
                        this.colWidths = newWidths;
                    }
                },

                stopResize() {
                    if (this.resizingIdx !== -1) {
                        this.resizingIdx = -1;
                        document.body.style.userSelect = '';
                        document.body.style.cursor = '';
                    }
                },

                features: (window.ROADMAP_DATA.features || []).map(f => ({
                    ...f,
                    lastModifiedBy: f.lastModifiedBy ?? '',
                    lastModifiedDate: f.lastModifiedDate ?? ''
                })),
                lastUpdated: window.ROADMAP_DATA.lastUpdated,
                
                get overallProgress() {
                    const totalPoints = this.features.reduce((sum, f) => sum + (f.points || 1), 0);
                    const completedWeighted = this.features.reduce((sum, f) => sum + ((f.points || 1) * f.percentage), 0);
                    return totalPoints ? (completedWeighted / totalPoints) : 0;
                },

                get totalFeatures() {
                    return this.features.length;
                },

                get completedCount() {
                    return this.features.filter(f => f.percentage === 100).length;
                },

                get inProgressCount() {
                    return this.features.filter(f => f.percentage > 0 && f.percentage < 100).length;
                },

                get pendingCount() {
                    return this.features.filter(f => f.percentage === 0).length;
                },

                get totalPoints() {
                    return this.features.reduce((sum, f) => sum + (f.points || 1), 0);
                }
            }
        }
    </script>
</body>
</html>
